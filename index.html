<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Analyzer Premium v2.6</title>
    <!-- Menggunakan Bootstrap 5 untuk tampilan rapi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card-prank {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
        }
        .btn-scan {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            transition: transform 0.2s;
        }
        .btn-scan:hover {
            transform: scale(1.05);
        }
        .loading-spinner {
            display: none;
        }
        #result-box {
            display: none;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center px-3">
    <div class="card-prank p-4 text-center">
        <h2 class="fw-bold mb-3 text-warning">🤖 AI Face Scanner</h2>
        <p class="text-secondary small">Gunakan kamera depan untuk menganalisis tingkat ketampanan / kecantikan wajah kamu secara akurat (Akurasi 99.9%).</p>
        
        <hr class="border-secondary my-4">

        <!-- Tampilan Awal -->
        <div id="setup-box">
            <div class="mb-4 text-start">
                <label class="form-label text-light small">Masukkan Nama Kamu:</label>
                <input type="text" id="userName" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: Budi">
            </div>
            <button class="btn btn-scan text-white w-100 py-3 fw-bold shadow" onclick="startScan()">MULAI ANALISIS WAJAH</button>
        </div>

        <!-- Efek Loading -->
        <div id="loading-box" class="loading-spinner my-4">
            <div class="spinner-border text-info" style="width: 3rem; height: 3rem;" role="status"></div>
            <p class="mt-3 text-info fw-semibold" id="loading-text">Menghubungkan ke satelit...</p>
        </div>

        <!-- Tampilan Hasil Prank -->
        <div id="result-box" class="mt-3">
            <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-white">
                <h4 class="fw-bold text-danger">⚠️ HASIL ERROR! ⚠️</h4>
                <p class="mb-0" id="prank-message"></p>
            </div>
            <button class="btn btn-outline-secondary btn-sm mt-3 text-light" onclick="resetPage()">Coba Lagi</button>
        </div>
    </div>
</div>

<script>
    function startScan() {
        const name = document.getElementById('userName').value.trim();
        if (!name) {
            alert('Masukkan nama kamu dulu biar AI-nya nggak bingung!');
            return;
        }

        // Sembunyikan setup awal
        document.getElementById('setup-box').style.display = 'none';
        // Tampilkan loading
        document.getElementById('loading-box').style.display = 'block';

        // Rangkaian teks loading biar meyakinkan
        const steps = [
            "Menghubungkan ke kamera depan...",
            "Memindai struktur tulang pipi...",
            "Mencocokkan dengan database simpanse...",
            "Menghitung kalkulasi akhir..."
        ];

        let currentStep = 0;
        const interval = setInterval(() => {
            if (currentStep < steps.length) {
                document.getElementById('loading-text').innerText = steps[currentStep];
                currentStep++;
            } else {
                clearInterval(interval);
                showPrankResult(name);
            }
        }, 1500); // Ganti teks setiap 1.5 detik
    }

    function showPrankResult(name) {
        document.getElementById('loading-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';

        // Pesan prank kocak bawaan
        const pesan = `Sistem mendeteksi kegagalan server karena wajah <strong>${name}</strong> melebihi batas standar ketampanan bumi. AI menduga kamu adalah buronan dari planet Neptunus yang menyamar jadi manusia biasa!`;
        
        document.getElementById('prank-message').innerHTML = pesan;
    }

    function resetPage() {
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('setup-box').style.display = 'block';
        document.getElementById('userName').value = '';
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
